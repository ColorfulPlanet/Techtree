<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-fullscreen">
    <meta name="screen-orientation" content="landscape">
    <title>メイドのお仕事アクション - プロトタイプ</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preload" as="image" href="assets/garden-background.jpg">
</head>
<body>
    <!-- 縦持ち警告 -->
    <div id="rotateWarning">
        <div class="rotate-icon">📱</div>
        <div class="rotate-message">画面を横向きにしてください</div>
        <div class="rotate-arrow">⟳</div>
    </div>
    
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        
        <!-- 仮想ジョイスティックエリア -->
        <div id="joystickArea"></div>
        
        <!-- 統合された隊列操作UI -->
        <div id="formationControl">
            <div class="label-top">広</div>
            <div id="formationSlider">
                <div id="formationTrack"></div>
                <div id="formationButton">
                    <div class="button-label">隊列</div>
                </div>
            </div>
            <div class="label-bottom">狭</div>
        </div>
        
        <!-- デバッグ情報表示 -->
        <div id="debugInfo">
            <div>先頭: <span id="frontCharacter">サクラ</span></div>
            <div>攻撃: <span id="frontAttack">モップ薙ぎ払い</span></div>
            <div>隊列: <span id="spreadMode">標準</span></div>
            <div>隊列間隔: <span id="formationSpacing">100</span></div>
        </div>

        <div id="partyHp"></div>

        <div id="jobObjectives">
            <div class="job-title">今日のお仕事</div>
            <div class="job-item" id="jobCleaning">
                <span class="job-icon">🧹</span>
                <div class="job-meta">
                    <div class="job-row">掃除 <span class="job-remain">残り 100%</span> <span class="job-check">○</span></div>
                    <div class="job-bar"><div class="job-bar-fill" data-job="cleaning"></div></div>
                </div>
            </div>
            <div class="job-item" id="jobCooking">
                <span class="job-icon">🍳</span>
                <div class="job-meta">
                    <div class="job-row">料理 <span class="job-remain">残り 100%</span> <span class="job-check">○</span></div>
                    <div class="job-bar"><div class="job-bar-fill" data-job="cooking"></div></div>
                </div>
            </div>
            <div class="job-item" id="jobLaundry">
                <span class="job-icon">🧺</span>
                <div class="job-meta">
                    <div class="job-row">洗濯 <span class="job-remain">残り 100%</span> <span class="job-check">○</span></div>
                    <div class="job-bar"><div class="job-bar-fill" data-job="laundry"></div></div>
                </div>
            </div>
        </div>

        <div id="hintText">敵の攻撃を見て、隊長と隊列幅を変えよう</div>

        <div id="swapOverlay" class="hidden">
            <div class="clear-card">
                <div class="clear-title" id="swapMessage">仲間になりました！</div>
                <div class="clear-sub">パーティーは3人までです。交代するメイドを選んでください</div>
                <div id="swapButtons" class="swap-buttons"></div>
                <button id="swapCancel" type="button">今は交代しない</button>
            </div>
        </div>

        <div id="gameOverOverlay" class="hidden">
            <div class="clear-card">
                <div class="clear-title">GAME OVER</div>
                <div class="clear-sub">3人ともへとへとです…</div>
                <button id="gameOverRetry" type="button">もういちど</button>
            </div>
        </div>

        <div id="clearOverlay" class="hidden">
            <div class="clear-card">
                <div class="clear-title">お仕事完了！</div>
                <div class="clear-sub">屋敷がピカピカになりました</div>
                <button id="retryButton" type="button">もういちど</button>
            </div>
        </div>
    </div>

    <!-- スクリプト読み込み -->
    <script src="js/character.js"></script>
    <script src="js/maid.js"></script>
    <script src="js/formation.js"></script>
    <script src="js/input.js"></script>
    <script src="js/joystick.js"></script>
    <script src="js/particles.js"></script>
    <script src="js/combat.js"></script>
    <script src="js/jobPile.js"></script>
    <script src="js/enemy.js"></script>
    <script src="js/stage.js"></script>
    <script src="js/recruit.js"></script>
    <script src="js/game.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-fullscreen">
    <meta name="screen-orientation" content="landscape">
    <title>メイドのお仕事アクション - プロトタイプ</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preload" as="image" href="assets/garden-background.jpg">
</head>
<body>
    <!-- 縦持ち警告 -->
    <div id="rotateWarning">
        <div class="rotate-icon">📱</div>
        <div class="rotate-message">画面を横向きにしてください</div>
        <div class="rotate-arrow">⟳</div>
    </div>
    
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        
        <!-- 仮想ジョイスティックエリア -->
        <div id="joystickArea"></div>
        
        <!-- 統合された隊列操作UI -->
        <div id="formationControl">
            <div class="label-top">広</div>
            <div id="formationSlider">
                <div id="formationTrack"></div>
                <div id="formationButton">
                    <div class="button-label">隊列</div>
                </div>
            </div>
            <div class="label-bottom">狭</div>
        </div>
        
        <!-- デバッグ情報表示 -->
        <div id="debugInfo">
            <div>先頭: <span id="frontCharacter">サクラ</span></div>
            <div>攻撃: <span id="frontAttack">モップ薙ぎ払い</span></div>
            <div>隊列: <span id="spreadMode">標準</span></div>
            <div>隊列間隔: <span id="formationSpacing">100</span></div>
        </div>

        <div id="partyHp"></div>

        <div id="jobObjectives">
            <div class="job-title">今日のお仕事</div>
            <div class="job-main">メイン：巨大なゴミの山 <span id="mainJobCheck">○</span></div>
            <div class="job-count-row">小★ <span id="jobSmallCount">0/6</span></div>
            <div class="job-count-row">中★★ <span id="jobMediumCount">0/3</span></div>
            <div class="job-count-row">大★★★ <span id="jobLargeCount">0/2</span></div>
            <div class="job-bar"><div class="job-bar-fill" id="jobClearFill"></div></div>
            <div class="job-remain" id="jobTotalCount">0 / 12（0%）</div>
        </div>

        <div id="hintText">北の巨大な山は後回しでOK。左右も探してみよう</div>

        <div id="swapOverlay" class="hidden">
            <div class="clear-card">
                <div class="clear-title" id="swapMessage">仲間になりました！</div>
                <div class="clear-sub">パーティーは3人までです。交代するメイドを選んでください</div>
                <div id="swapButtons" class="swap-buttons"></div>
                <button id="swapCancel" type="button">今は交代しない</button>
            </div>
        </div>

        <div id="gameOverOverlay" class="hidden">
            <div class="clear-card">
                <div class="clear-title">GAME OVER</div>
                <div class="clear-sub">3人ともへとへとです…</div>
                <button id="gameOverRetry" type="button">もういちど</button>
            </div>
        </div>

        <div id="clearOverlay" class="hidden">
            <div class="clear-card">
                <div class="clear-title">メインお仕事完了！</div>
                <div class="clear-sub">巨大なゴミの山を片付けました。残りの仕事はやり込み用です</div>
                <button id="retryButton" type="button">もういちど</button>
            </div>
        </div>
    </div>

    <!-- スクリプト読み込み -->
    <script src="js/character.js"></script>
    <script src="js/maid.js"></script>
    <script src="js/formation.js"></script>
    <script src="js/input.js"></script>
    <script src="js/joystick.js"></script>
    <script src="js/particles.js"></script>
    <script src="js/combat.js"></script>
    <script src="js/jobPile.js"></script>
    <script src="js/enemy.js"></script>
    <script src="js/stage.js"></script>
    <script src="js/recruit.js"></script>
    <script src="js/progress.js"></script>
    <script src="js/game.js"></script>
</body>
</html>

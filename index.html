<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3人パーティー隊列システム - プロトタイプ</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        
        <!-- 仮想ジョイスティックエリア -->
        <div id="joystickArea"></div>
        
        <!-- 統合された隊列操作UI -->
        <div id="formationControl">
            <div class="label-top">広</div>
            <div id="formationSlider">
                <div id="formationTrack"></div>
                <div id="formationButton">
                    <div class="button-label">隊列</div>
                </div>
            </div>
            <div class="label-bottom">狭</div>
        </div>
        
        <!-- デバッグ情報表示 -->
        <div id="debugInfo">
            <div>先頭: <span id="frontCharacter">A</span></div>
            <div>隊列間隔: <span id="formationSpacing">100</span></div>
        </div>
    </div>

    <!-- スクリプト読み込み -->
    <script src="js/character.js"></script>
    <script src="js/formation.js"></script>
    <script src="js/input.js"></script>
    <script src="js/joystick.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
